# =============================================================================
#  gradle.properties
# =============================================================================

# --- JavaCV / JavaCPP (reconocimiento facial) ---
# El plugin org.bytedeco.gradle-javacpp-platform, aplicado en build.gradle, elige los binarios
# nativos de UNA plataforma en vez de las nueve que trae opencv-platform. El JAR ejecutable pasa
# de 417 MB a 129 MB. Medido, no estimado.
#
# POR QUE ESTA COMENTADA
# Sin valor, el plugin usa la plataforma de la maquina que compila: en Windows saca un JAR para
# Windows, y el CI sobre Linux saca uno para Linux, sin que nadie pase nada. Fijarla acá
# obligaria al CI a pisarla, y el override NO funciona: ni -Pjavacpp.platform ni
# -Djavacpp.platform le ganan al valor de este archivo. Comprobado; con el valor puesto, el
# build sobre Linux se llevaria los binarios de Windows y OpenCV no cargaria.
#
# CUANDO SI DESCOMENTARLA
# Solo para compilar cruzado, o sea sacar desde esta maquina el artefacto de otra plataforma.
# Para el instalador de Windows no hace falta: se arma en Windows.
#
# Historia: esta linea existia desde el Sprint 4 sin efecto alguno, porque el plugin que la lee
# no estaba aplicado. Detalle y consecuencias en el ADR-0007, decision 2.
#javacpp.platform=windows-x86_64
