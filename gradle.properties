# --- JavaCV / JavaCPP (reconocimiento facial, Sprint 4) ---
# Restringe la descarga de binarios nativos de OpenCV solo a Windows x86_64.
# Sin esta linea, Gradle baja ~600 MB de binarios de Linux y macOS que en
# desarrollo local no se usan.
#
# ATENCION: si el pipeline de CI corre en Linux, alli hay que quitar esta
# linea o sobreescribirla con -Pjavacpp.platform=linux-x86_64. Ver ADR-0007.
javacpp.platform=windows-x86_64
