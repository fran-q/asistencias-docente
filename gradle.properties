# --- JavaCV / JavaCPP (reconocimiento facial, Sprint 4) ---
# La intencion de esta linea era que Gradle bajara solo los binarios de OpenCV
# para Windows en vez de los de las diez plataformas.
#
# HOY NO TIENE EFECTO. Esta propiedad la lee el plugin
# org.bytedeco.gradle-javacpp-platform, que no esta aplicado en build.gradle:
# sin el, opencv-platform arrastra igual todos los binarios (23 jars, entre
# ellos android, ios, linux y macOS). Comprobado listando el runtimeClasspath.
#
# Se deja porque documenta la intencion y porque es la propiedad que habria que
# respetar el dia que se aplique el plugin. Detalle y consecuencias en el
# ADR-0007, decision 2.
#
# Nota para el CI: como la restriccion no aplica, el build sobre Linux NO
# necesita ningun override; linux-x86_64 ya viene en el classpath.
javacpp.platform=windows-x86_64
