# =============================================================================
#  application-instalacion.properties
#  El perfil de la instalacion autonoma: la que corre en la maquina de la
#  institucion, sin internet y sin terminal (ADR-0022).
#
#  Lo activa el lanzador con --spring.profiles.active=instalacion.
#
#  SIN SECRETOS. Este archivo viaja adentro del JAR, igual que application.properties.
#  Lo que cambia de una instalacion a otra --la contrasena de la base, la clave de
#  cifrado biometrico-- llega por variables de entorno que escribe el instalador.
#  Por eso cada valor de abajo tiene la forma ${VARIABLE:default}.
# =============================================================================

# ---- La modalidad ----
# De esto cuelgan el asistente de primer arranque, la recuperacion por clave, el respaldo
# descargable, que las cuentas nuevas nazcan verificadas y que el alta publica se cierre.
app.instalacion.autonoma=true

# ---- Base de datos ----
# Puerto 3307 y no 3306: la MariaDB que trae el instalador es propia de Visum, y la maquina
# puede tener ya un XAMPP o un MySQL escuchando en el puerto de siempre. Dos motores peleando
# por el mismo puerto es una instalacion que no arranca y nadie sabe por que.
spring.datasource.url=jdbc:mariadb://127.0.0.1:${VISUM_DB_PUERTO:3307}/asistenciautomatica
spring.datasource.username=${VISUM_DB_USUARIO:visum}
spring.datasource.password=${VISUM_DB_PASSWORD:}
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver

# La herramienta del respaldo, la que trae la MariaDB empaquetada. Si queda en el default,
# tiene que estar en el PATH, y en una instalacion no lo va a estar.
app.instalacion.mysqldump=${VISUM_MYSQLDUMP:mysqldump}

# ---- Rendimiento ----
# Las plantillas no cambian entre arranques: releerlas en cada request es trabajo tirado.
spring.thymeleaf.cache=true
spring.jpa.show-sql=false

# ---- Logs ----
# A archivo, y no solo a la consola: la aplicacion corre como servicio de Windows y no hay
# ninguna consola donde mirar. Sin esto, el dia que algo falle no queda rastro de nada.
logging.file.name=${VISUM_LOGS:logs/visum.log}
logging.logback.rollingpolicy.max-file-size=10MB
logging.logback.rollingpolicy.max-history=30
logging.level.root=INFO

# ---- Correo ----
# No se toca app.mail.canal a proposito. En esta modalidad no queda ningun camino que mande
# correo --el alta publica esta cerrada, las cuentas nacen verificadas y la recuperacion va por
# la clave-- asi que el canal no se usa. Ponerlo en "consola" haria que el arranque escriba la
# advertencia grande de que cualquiera que vea la consola entra a cualquier cuenta, que aca
# seria una alarma por algo que no esta pasando.
