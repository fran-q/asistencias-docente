# =============================================================================
#  application-prod.properties
#  El perfil del despliegue en internet, con correo y detras de un proxy con HTTPS.
#
#  SIN SECRETOS. Este archivo viaja adentro del JAR y esta en un repositorio publico.
#  Lo que es secreto llega por variables de entorno, y ninguna de las obligatorias
#  tiene valor por defecto: si falta una, el sistema no arranca. Tambien lo frena
#  ControlDeArranqueConfig si la clave biometrica es la de desarrollo.
#
#  Obligatorias: DB_URL, DB_USUARIO, DB_PASSWORD, BIOMETRIA_CLAVE, BIOMETRIA_SALT,
#                MAIL_HOST, MAIL_PORT, MAIL_USER, MAIL_PASS, MAIL_FROM.
# =============================================================================

# ---- Modalidad ----
# Literales y no con variable: en internet no hay caso en que estos dos cambien.
app.instalacion.autonoma=false
app.mail.canal=correo

# El alta publica arranca cerrada: una institucion nueva se crea abriendola a proposito.
app.alta.publica=${ALTA_PUBLICA:false}

# ---- Base de datos ----
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USUARIO}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver

# Si por error se apunta a una base con otras tablas, que falle: con esto en true, Flyway
# se plantaria en la version 1 y daria por aplicado lo que no sabe si esta.
spring.flyway.baseline-on-migrate=false

# ---- Detras del proxy ----
# Tomcat lee X-Forwarded-For y X-Forwarded-Proto solo si vienen de una direccion interna, y
# con eso resuelve la IP real y si la conexion fue HTTPS. Sin esto, isSecure() da false, las
# cookies salen sin Secure y no se manda HSTS. Exige que el puerto de la aplicacion quede
# accesible solamente desde el proxy.
server.forward-headers-strategy=native
server.servlet.session.cookie.secure=true

# Termina lo que esta en curso antes de cerrar: un despliegue no le corta un registro a nadie.
server.shutdown=graceful

# ---- Correo ----
spring.mail.host=${MAIL_HOST}
spring.mail.port=${MAIL_PORT}
spring.mail.username=${MAIL_USER}
spring.mail.password=${MAIL_PASS}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
app.mail.remitente=${MAIL_FROM}

# ---- Logs ----
# A la salida estandar: los junta el contenedor, y un archivo adentro se pierde al recrearlo.
logging.level.root=INFO
spring.jpa.show-sql=false
