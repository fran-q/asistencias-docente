# =============================================================================
#  application.properties
#  Configuracion BASE de la aplicacion (versionada en git, sin secretos).
#
#  Las credenciales y configuracion local viven en application-local.properties
#  (gitignored). Los tests usan application-test.properties (perfil "test").
#
#  Como activar perfiles:
#   - Local:  ./gradlew bootRun  (lo activa automaticamente, ver build.gradle)
#             En IntelliJ: Run Configuration > Active profiles: local
#   - Tests:  Se activa via @ActiveProfiles("test") en las clases de test
#   - CI:     Idem tests
# =============================================================================

spring.application.name=asistencias

# ---- JPA / Hibernate ----
# El esquema lo gestiona Flyway, Hibernate solo valida que coincida con las entidades.
# El dialecto lo autodetecta Hibernate desde el driver MariaDB (no hace falta setearlo).
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=America/Argentina/Ushuaia

# ---- Flyway (migraciones de esquema) ----
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# La contabilidad de Flyway vive en una base aparte, no entre las tablas del sistema.
#
# Por que. flyway_schema_history no es del dominio: es el cuaderno de la herramienta,
# donde anota que migracion aplico y con que huella. Mezclada con las 15 tablas del
# modelo aparecia como una decima sexta que no esta en el diagrama entidad-relacion ni
# la escribio nadie, y obligaba a explicarla cada vez que se abre la base.
#
# Que NO es esto. No es sacar Flyway ni dejar de versionar el esquema: las migraciones
# se siguen aplicando y validando igual, y RNF-35 se sigue cumpliendo. Lo unico que
# cambia es donde la herramienta guarda su registro.
#
# Por que no se borra la tabla y listo. Porque Flyway la usa para saber que ya aplico.
# Sin ella, y con baseline-on-migrate, al arrancar crea una nueva vacia, se planta en la
# version 1 e intenta correr V002 en adelante sobre una base que ya las tiene: la
# migracion falla y la aplicacion NO levanta. Probado.
#
# default-schema  -> donde se crea el historial
# schemas         -> la base sobre la que corren las migraciones
spring.flyway.default-schema=asistenciautomatica_meta
spring.flyway.schemas=asistenciautomatica

# OJO: default-schema no solo dice donde va el historial. Flyway lo usa TAMBIEN como
# esquema por defecto de la conexion mientras migra, asi que un CREATE TABLE sin
# calificar termina en la base del historial y no en la del sistema. Con las FK el
# sintoma es enganoso: "errno 150, foreign key incorrectly formed", porque las tablas
# referenciadas no estan en el esquema donde se esta creando.
#
# Las migraciones V001 a V014 no lo sufrieron porque se aplicaron ANTES de que el
# historial se mudara de base. La primera escrita despues fue V015, y ahi aparecio.
#
# Por eso toda tabla se nombra ${esquema}.tabla en las migraciones. El placeholder
# existe para no dejar el nombre de la base escrito a mano en cada archivo: si algun
# dia cambia, cambia aca y no en veinte lugares.
spring.flyway.placeholders.esquema=asistenciautomatica

# ---- Servidor ----
server.port=8080
server.servlet.session.timeout=30m
server.error.include-message=always
server.error.include-binding-errors=always
# Permitir POSTs grandes para el registro facial: ~20 frames base64 pueden
# llegar a 2-3 MB. Default de Tomcat es 2 MB y corta el body silenciosamente.
server.tomcat.max-http-form-post-size=20MB
server.tomcat.max-swallow-size=20MB

# ---- Idioma ----
# El sistema esta en castellano y se usa en Tierra del Fuego; no hay ninguna pantalla
# traducida ni ningun bundle de mensajes. El locale se fija para que lo que Java formatea
# por idioma salga en castellano y no segun el Accept-Language del navegador: con esta
# maquina configurada en ingles, la fecha del inicio decia "Friday 4 of September".
#
# "fixed" y no el resolvedor por defecto justamente por eso: no se negocia con el navegador
# algo que la aplicacion no sabe hacer de las dos formas.
#
# Hoy afecta a un solo lugar --el encabezado del panel de inicio, el unico que formatea un
# nombre de dia o de mes; el resto de las fechas van en dd/MM/yyyy, que no depende del
# idioma, y los dias de la semana salen de la etiqueta del enum--. Se declara igual para que
# el proximo formato sensible al idioma nazca bien y no haya que descubrir esto de nuevo.
spring.web.locale=es_AR
spring.web.locale-resolver=fixed

# ---- Logs ----
logging.level.root=INFO
logging.level.org.springframework.security=INFO
# Patron de consola con tenantId y userId via MDC (para multi-tenant traceability)
logging.pattern.console=%d{HH:mm:ss.SSS} [%thread] %-5level [tenant=%X{tenantId:-N/A} user=%X{userId:-N/A}] %logger{36} - %msg%n

# ---- Actuator (solo lo basico, sin exponer endpoints sensibles) ----
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when-authorized

# ---- Biometria: cifrado de modelos faciales (Sprint 4) ----
# Clave y salt para cifrar el modelo LBPH antes de persistirlo (AES, Spring
# Security Crypto). El salt debe ser hexadecimal.
# ATENCION: estos son valores de DESARROLLO. En un despliegue real deben
# venir de variables de entorno (BIOMETRIA_CLAVE / BIOMETRIA_SALT) y NO
# estar versionados. Ver ADR-0007.
app.biometria.clave-cifrado=${BIOMETRIA_CLAVE:dev-clave-biometrica-no-usar-en-produccion}
app.biometria.salt=${BIOMETRIA_SALT:5c0d1e2f3a4b5c6d}
# Minimo de capturas utiles para entrenar el modelo. La secuencia guiada apunta a 15
# (5 etapas x 3), asi que este numero es el piso por debajo del cual no vale la pena
# entrenar, no el objetivo.
app.biometria.minimo-capturas-validas=5

# --- Captura guiada del rostro (ADR-0012) ---
# La secuencia pide 5 poses y toma 3 capturas de cada una.
app.biometria.captura.etapas=5
app.biometria.captura.capturas-por-etapa=3

# --- Umbrales de calidad de cada captura ---
# OJO: estos valores dependen de la camara y de la luz del lugar. Vienen con un default
# razonable, pero se calibran mirando la linea CALIDAD del log, igual que el umbral de
# reconocimiento. Ver Documentacion/5-informes/calibracion-umbral.md
#
# Varianza del Laplaciano: cuanto borde tiene el recorte. Una foto movida la baja.
app.biometria.calidad.nitidez-minima=45.0
# Brillo medio del rostro, sobre 255.
app.biometria.calidad.brillo-minimo=55.0
app.biometria.calidad.brillo-maximo=205.0
# Desvio estandar del recorte: si es muy bajo, la cara sale plana (contraluz).
app.biometria.calidad.contraste-minimo=22.0
# Que porcentaje del cuadro ocupa el rostro. Acota "acercate" y "alejate".
app.biometria.calidad.porcentaje-cuadro-minimo=6.0
app.biometria.calidad.porcentaje-cuadro-maximo=55.0
# Diferencia media minima (0-255) entre dos recortes para considerarlos poses distintas.
app.biometria.calidad.diferencia-minima=8.0
# Tamano (px) al que se normaliza cada rostro antes de entrenar
app.biometria.tamano-rostro=200
# --- Ventana de confirmacion del pase (ADR-0013) ---
# Cuanto tiene que sostenerse la MISMA identidad antes de marcar. Sin esto, un cambio de
# iluminacion que haga oscilar el reconocimiento entre dos personas parecidas marca a la
# equivocada, y esa marca queda en el registro administrativo.
app.biometria.confirmacion.ventana-ms=3000
# Piso de lecturas, para que la ventana no se cumpla con dos frames separados.
app.biometria.confirmacion.lecturas-minimas=3
# Hueco a partir del cual se considera que la persona se fue del cuadro y la racha se corta.
# Tiene que ser mayor al intervalo del loop del navegador (1000 ms) para tolerar un frame
# perdido sin reiniciar la cuenta.
app.biometria.confirmacion.hueco-maximo-ms=2500

# --- Los dos controles que deciden si un rostro se reconoce ---
#
# LBPH NO sabe decir "no conozco a esta persona": compara contra cada modelo y
# devuelve el mas parecido, aunque el parecido sea pesimo. Por eso hacen falta dos
# condiciones y no una.
#
# 1) Umbral: distancia maxima para aceptar el mejor candidato. Menor = mas parecido.
#    Calibrado sobre 85 mediciones reales de esta instalacion: los aciertos caian
#    entre 28 y 55, y las confusiones entre 73 y 90. Con el 100 que habia antes se
#    aceptaba el 98% de los intentos, incluida gente que no estaba registrada.
# Cuanto puede quedar un modelo DESCIFRADO en memoria sin que nadie lo use, y cada cuanto
# se revisa. Mientras una entrada vive, el dato biometrico esta en claro en RAM: que se
# quede mientras el pase corre es el precio de la velocidad, que se quede toda la noche
# despues de la ultima clase no compra nada. 30 min cubre el hueco entre dos clases
# seguidas sin obligar a descifrar de nuevo.
app.biometria.cache-minutos-inactividad=30
app.biometria.cache-barrido-ms=300000

app.biometria.umbral-confianza=65.0
#
# 2) Margen: cuanto tiene que ganarle el mejor candidato al segundo. Un empate no es
#    una identificacion: cual gana lo decide una sombra y no la identidad. En esas
#    mismas mediciones, 15 de 80 intentos tuvieron margen menor a 5, o sea que un
#    tercio largo eran practicamente cara o cruz.
#    Si hay un solo modelo cargado no hay segundo contra quien medir y no aplica.
app.biometria.margen-minimo=12.0

# ---- Job de generacion de ausencias (RF-19) ----
# Materializa las filas AUSENTE de los horarios ya terminados sin marca.
# El calculo al vuelo del listado sigue cubriendo la ventana entre el fin
# de la clase y la proxima corrida del job. Cron por defecto: cada 30 min.
app.asistencia.ausencias-habilitado=true
app.asistencia.ausencias-cron=0 */30 * * * *

# ---- Marca de salida y bloques de presencia (RF-74 a RF-83, ADR-0017) ----
# Minutos que tienen que pasar desde la entrada para que se acepte una salida.
# Sin esta guarda, el docente que se queda conversando frente a la camara despues
# de marcar su llegada recibe su propia salida unos segundos despues, y el
# registro pasa a decir que dio una clase de medio minuto. La pausa de 5 s del
# frontend no alcanza: fue dimensionada para no repetir UNA marca, no para
# separar dos eventos con significados opuestos.
#
# Es global y no por institucion: no depende de como este edilicia ni
# horariamente organizado el establecimiento, sino de cuanto tarda una persona en
# irse de veras. El umbral de separacion entre clases, que si depende de eso, vive
# en instituciones.umbral_separacion_min (RF-76).
app.asistencia.permanencia-minima-min=10

# ---- Correo saliente ----
# Por defecto apunta a un SMTP local de captura (Mailpit / MailHog en el 1025),
# que muestra los correos en una web sin mandarlos a internet. Para usar un
# servidor real basta con exportar las variables de entorno: el codigo habla
# SMTP estandar y no sabe a que servidor le escribe.
# Por donde salen los codigos de un solo uso.
#   correo  -> se envian por SMTP (lo de abajo). Es el default.
#   consola -> se escriben en la consola del servidor y NO se envia nada.
#
# El modo consola existe para poder probar el alta de institucion, la verificacion de cuenta
# y la recuperacion de contrasena sin depender de tener un SMTP levantado. Con el SMTP caido,
# la pantalla dice "revisa tu correo" y no llega nada: no falla a la vista, se queda esperando.
#
# NO usar consola en produccion: cualquiera que vea la consola puede entrar a cualquier cuenta.
# El arranque escribe una advertencia grande cuando esta puesto.
app.mail.canal=${MAIL_CANAL:correo}

spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:1025}
spring.mail.username=${MAIL_USER:}
spring.mail.password=${MAIL_PASS:}
spring.mail.properties.mail.smtp.auth=${MAIL_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_TLS:false}
# Timeouts cortos: si el SMTP no responde, el usuario no se queda esperando.
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
app.mail.remitente=${MAIL_FROM:no-responder@cent35.edu.ar}

# ---- Alta de instituciones ----
# El alta ocurre antes de que exista el tenant, asi que no hay rol contra el cual
# autorizarla: la protege el codigo que se manda al correo declarado, y la institucion
# no llega a crearse hasta que ese codigo se valida (ADR-0010).
#
# Como la pantalla es publica, este tope evita que se use para mandarle mensajes
# repetidos a una casilla ajena. Se cuenta por direccion de destino y por hora.
app.alta.max-envios-por-hora=3

# ---- Codigos de verificacion de correo y recuperacion de contrasena ----
# Vigencia corta: un codigo filtrado deja de servir enseguida.
app.verificacion.minutos-vigencia=15
# Tope de intentos fallidos antes de descartar el codigo. Con 6 digitos hay un
# millon de combinaciones; sin este tope se prueban por fuerza bruta.
app.verificacion.max-intentos=5
# Tope de codigos por hora y usuario, para que no se use como generador de spam.
app.verificacion.max-por-hora=5

# ---- Cambio de contrasena ----
# Horas que tienen que pasar entre una contrasena nueva y la siguiente. El tope de
# codigos de arriba acota cuantas veces se PIDE el codigo; este acota cuantas veces
# se FIJA una clave, que es otra cosa: con un codigo en la mano se podia cambiar la
# contrasena las veces que uno quisiera. Rige para los dos caminos, Mi cuenta y la
# recuperacion publica. En cero queda desactivado.
app.password.horas-entre-cambios=24

# =============================================================================
#  REPORTES
# =============================================================================
# Tope de filas de un reporte. Un rango de un ano sin filtros trae todo a memoria y de ahi
# al HTML, que es donde el navegador se cae primero. Se corta y se avisa, en vez de tardar
# dos minutos y morir sin explicacion.
app.reportes.max-filas=2000
