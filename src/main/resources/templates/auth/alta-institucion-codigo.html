<!DOCTYPE html>
<!--
  Alta de institución, paso 2: el código que confirma el correo.

  Migrada al layout de acceso de las otras cuatro pantallas. No venía en el
  paquete de rediseño, así que quedaba con la tarjeta centrada vieja justo
  después del paso 1, que ya es la pantalla partida: dos lenguajes visuales
  dentro de un mismo flujo, y en el momento en que hay que confiar en el sistema
  para entregarle un correo.

  Sigue el patrón de auth/recuperar-codigo.html, que es la misma forma: seis
  casillas en vez de un input de seis dígitos. El código llega por mail y se
  copia a mano; con casillas se ve cuántas faltan sin contar caracteres, y
  codigo-input.js las encadena para que pegar el código completo lo distribuya
  solo. Lo que viaja al servidor es el hidden "codigo", el mismo parámetro que
  el controlador ya leía, así que no cambia nada del lado del backend.

  Acá SÍ se muestra el correo, a diferencia de la recuperación: es el que la
  persona acaba de escribir en el paso anterior, así que no revela nada que no
  haya puesto ella misma.
-->
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Confirmar el alta - Visum</title>
    <script>
        (function () {
            var t = null;
            try { t = localStorage.getItem('tema'); } catch (e) { /* modo privado */ }
            if (!t) {
                t = (window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches)
                    ? 'claro' : 'oscuro';
            }
            document.documentElement.setAttribute('data-tema', t);
        })();
    </script>
    <link rel="stylesheet" th:href="@{/css/main.css}">
</head>
<body>
<div class="auth">

    <aside th:replace="~{auth/marca :: panel}"></aside>

    <main class="auth__panel">
        <div class="auth__tema">
            <button type="button" id="tema-toggle" class="btn-icono"
                    aria-label="Cambiar entre modo claro y oscuro" title="Cambiar de tema">
                <!-- Las clases tema-toggle__sol / __luna van dentro de los fragmentos:
                     th:replace descarta los atributos del placeholder. -->
                <svg th:replace="~{layout/iconos :: sol}"></svg>
                <svg th:replace="~{layout/iconos :: luna}"></svg>
            </button>
        </div>

        <div class="auth__centro">
            <div class="auth__form">

                <div class="auth__logo auth__logo--movil">
                    <span class="auth__logo-marca" aria-hidden="true">V</span>
                    <span class="auth__logo-texto">Visum</span>
                </div>

                <!-- Volver descarta lo tipeado y hay que completar el formulario otra vez,
                     así que el enlace dice eso y no "volver": no hay borrador guardado. -->
                <a th:href="@{/alta-institucion}" class="auth__volver">
                    <svg th:replace="~{layout/iconos :: flechaIzq}"></svg>
                    <span>Corregir los datos</span>
                </a>

                <h1>Confirmá tu correo</h1>
                <p>
                    Mandamos un código de 6 dígitos a
                    <strong style="color:var(--text);font-weight:500"
                            th:text="${email}">correo@ejemplo.com</strong>.
                    Vence en unos minutos y se usa una sola vez.
                </p>

                <div class="pasos" role="group" aria-label="Paso 2 de 2">
                    <span class="pasos__tramo pasos__tramo--hecho"></span>
                    <span class="pasos__tramo pasos__tramo--hecho"></span>
                    <span class="pasos__texto">2 de 2</span>
                </div>

                <!-- Un código equivocado vuelve acá con el motivo. Si en cambio se agotaron
                     los intentos o venció, el controlador descarta el alta entera y redirige
                     al paso 1 con un flash: por eso hay dos lugares donde puede aparecer un
                     aviso y los dos tienen que estar. -->
                <div th:if="${error}" class="alert alert--error" role="alert">
                    <p th:text="${error}">Error</p>
                </div>

                <!-- Nada se creó todavía: la institución y su cuenta aparecen recién cuando
                     este código se valida. Si se abandona acá, no queda ningún registro. -->
                <form th:action="@{/alta-institucion/codigo}" method="post"
                      data-codigo-form novalidate>

                    <input type="hidden" name="codigo" data-codigo-valor>

                    <!-- aria-label por casilla: un lector de pantalla necesita saber en cuál
                         de las seis está parado. El grupo lleva su propia etiqueta. -->
                    <div class="codigo-input" role="group" aria-label="Código de seis dígitos"
                         data-codigo-casillas>
                        <input inputmode="numeric" maxlength="1" autocomplete="one-time-code"
                               aria-label="Dígito 1" autofocus placeholder=" ">
                        <input inputmode="numeric" maxlength="1" aria-label="Dígito 2" placeholder=" ">
                        <input inputmode="numeric" maxlength="1" aria-label="Dígito 3" placeholder=" ">
                        <input inputmode="numeric" maxlength="1" aria-label="Dígito 4" placeholder=" ">
                        <input inputmode="numeric" maxlength="1" aria-label="Dígito 5" placeholder=" ">
                        <input inputmode="numeric" maxlength="1" aria-label="Dígito 6" placeholder=" ">
                    </div>

                    <button type="submit" class="btn btn--primary btn--lg btn--full"
                            style="margin-top:var(--space)" data-texto-enviando="Creando...">
                        Crear la institución
                    </button>
                </form>

                <p class="auth__nota">
                    ¿No llegó? <a th:href="@{/alta-institucion}">Volvé a completar el
                    formulario</a> para recibir uno nuevo.
                </p>
            </div>
        </div>
    </main>
</div>

<div id="flash-data"
     th:attr="data-success=${flashMensaje}, data-error=${flashError}" hidden></div>

<script th:src="@{/js/comun/tema.js}" defer></script>
<script th:src="@{/js/comun/toast.js}" defer></script>
<script th:src="@{/js/comun/envio-form.js}" defer></script>
<script th:src="@{/js/comun/codigo-input.js}" defer></script>
</body>
</html>
