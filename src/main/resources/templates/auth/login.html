<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar sesión - Visum</title>
    <link rel="stylesheet" th:href="@{/css/main.css}">
</head>
<body class="login-body">
    <main class="login-card">
        <header class="login-card__header">
            <div class="login-card__logo" aria-hidden="true">V</div>
            <h1>Visum</h1>
            <p class="login-card__subtitle">
                Asistencia docente con reconocimiento facial
            </p>
        </header>

        <form th:action="@{/login}" method="post" class="login-form">
            <div class="form-group">
                <label for="username">Usuario</label>
                <input type="text" id="username" name="username" required
                       autocomplete="username"
                       th:value="${ultimoUsuario}"
                       th:attr="autofocus=${ultimoUsuario == null ? 'autofocus' : null}">
            </div>

            <div class="form-group">
                <label for="password">Contraseña</label>
                <div class="password-input">
                    <input type="password" id="password" name="password" required
                           autocomplete="current-password"
                           th:attr="autofocus=${ultimoUsuario != null ? 'autofocus' : null}">
                    <button type="button" class="password-toggle"
                            aria-label="Mostrar contraseña"></button>
                </div>
            </div>

            <button type="submit" class="btn btn--primary btn--full" data-texto-enviando="Ingresando...">Ingresar</button>
        </form>

        <p class="login-card__ayuda">
            <a th:href="@{/recuperar}">¿Olvidaste tu contraseña?</a>
        </p>
        <!-- Enlace discreto: el alta de institucion es una operacion de instalacion, no algo
             que un usuario del dia a dia necesite. Exponerlo no es un riesgo porque el
             alta no crea nada hasta que se valide el codigo enviado al correo. -->
        <p class="login-card__ayuda">
            <a th:href="@{/alta-institucion}">Registrar una institución nueva</a>
        </p>
    </main>

    <!-- Flash data: convierte ?error y ?logout en toasts -->
    <div th:if="${param.error}"  id="flash-data"
         data-error="Usuario o contraseña incorrectos." hidden></div>
    <div th:if="${param.logout}" id="flash-data"
         data-success="Sesión cerrada correctamente." hidden></div>

    <script th:src="@{/js/comun/toast.js}" defer></script>
    <script th:src="@{/js/comun/envio-form.js}" defer></script>
    <script th:src="@{/js/comun/password-ui.js}" defer></script>
</body>
</html>
