<!DOCTYPE html>
<!--
  Pantalla de acceso.

  Dos columnas: a la izquierda la marca y qué hace el sistema, a la derecha el
  formulario. La tarjeta centrada anterior dejaba la pantalla más usada del
  sistema como un recuadro de 380 px en medio de un fondo vacío, sin decir en
  ningún momento a qué se está entrando.

  Debajo de 860 px el panel de marca desaparece —en un teléfono la mitad de la
  pantalla no puede ser decorativa— y el logo pasa arriba del formulario. Eso lo
  resuelve el CSS; acá el HTML es el mismo para las dos vistas.

  El fragmento del panel de marca se comparte con recuperación y alta
  (auth/marca.html) para que las cuatro pantallas de acceso no se
  desincronicen: eran tres tarjetas distintas y ya diferían en el subtítulo.
-->
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar sesión - Visum</title>
    <script>
        (function () {
            var t = null;
            try { t = localStorage.getItem('tema'); } catch (e) { /* modo privado */ }
            if (!t) {
                t = (window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches)
                    ? 'claro' : 'oscuro';
            }
            document.documentElement.setAttribute('data-tema', t);
        })();
    </script>
    <link rel="stylesheet" th:href="@{/css/main.css}">
</head>
<body>
<div class="auth">

    <aside th:replace="~{auth/marca :: panel}"></aside>

    <main class="auth__panel">
        <div class="auth__tema">
            <button type="button" id="tema-toggle" class="btn-icono"
                    aria-label="Cambiar entre modo claro y oscuro" title="Cambiar de tema">
                <!-- Las clases tema-toggle__sol / __luna van dentro de los fragmentos:
                     th:replace descarta los atributos del placeholder. -->
                <svg th:replace="~{layout/iconos :: sol}"></svg>
                <svg th:replace="~{layout/iconos :: luna}"></svg>
            </button>
        </div>

        <div class="auth__centro">
            <div class="auth__form">

                <div class="auth__logo auth__logo--movil">
                    <span class="auth__logo-marca" aria-hidden="true">V</span>
                    <span class="auth__logo-texto">Visum</span>
                </div>

                <h1>Iniciar sesión</h1>
                <p>Ingresá con tu cuenta institucional.</p>

                <form th:action="@{/login}" method="post">
                    <div class="auth__campos">
                        <div class="form-group" style="margin:0">
                            <label for="username">Usuario</label>
                            <input type="text" id="username" name="username" required
                                   autocomplete="username"
                                   th:value="${ultimoUsuario}"
                                   th:attr="autofocus=${ultimoUsuario == null ? 'autofocus' : null}">
                        </div>

                        <div class="form-group" style="margin:0">
                            <!-- El enlace de recuperación va acá, al lado de la etiqueta, y no
                                 al pie de la tarjeta: es donde uno mira cuando se da cuenta de
                                 que no se acuerda la contraseña. -->
                            <div class="auth__campo-fila">
                                <label for="password">Contraseña</label>
                                <a th:href="@{/recuperar}">¿La olvidaste?</a>
                            </div>
                            <div class="password-input">
                                <input type="password" id="password" name="password" required
                                       autocomplete="current-password"
                                       th:attr="autofocus=${ultimoUsuario != null ? 'autofocus' : null}">
                                <button type="button" class="password-toggle"
                                        aria-label="Mostrar contraseña"></button>
                            </div>
                        </div>

                        <button type="submit" class="btn btn--primary btn--lg btn--full"
                                style="margin-top:5px" data-texto-enviando="Ingresando...">
                            Ingresar
                        </button>
                    </div>
                </form>

                <!-- Enlace discreto: el alta de institución es una operación de
                     instalación, no algo que un usuario del día a día necesite. Exponerlo
                     no es un riesgo porque el alta no crea nada hasta que se valide el
                     código enviado al correo. -->
                <div class="auth__pie">
                    <p>
                        ¿Tu institución todavía no está en Visum?
                        <a th:href="@{/alta-institucion}">Registrala</a>
                    </p>
                </div>
            </div>
        </div>
    </main>
</div>

<!-- Flash data: convierte ?error y ?logout en toasts -->
<div th:if="${param.error}"  id="flash-data"
     data-error="Usuario o contraseña incorrectos." hidden></div>
<div th:if="${param.logout}" id="flash-data"
     data-success="Sesión cerrada correctamente." hidden></div>

<script th:src="@{/js/comun/tema.js}" defer></script>
<script th:src="@{/js/comun/toast.js}" defer></script>
<script th:src="@{/js/comun/envio-form.js}" defer></script>
<script th:src="@{/js/comun/password-ui.js}" defer></script>
</body>
</html>
