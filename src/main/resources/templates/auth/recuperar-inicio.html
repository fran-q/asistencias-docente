<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recuperar contraseña - Asistencias</title>
    <link rel="stylesheet" th:href="@{/css/main.css}">
</head>
<body class="login-body">
    <main class="login-card">
        <header class="login-card__header">
            <div class="login-card__logo">A</div>
            <h1>Recuperar contraseña</h1>
            <p class="login-card__subtitle">Te enviamos un código por correo</p>
        </header>

        <form th:action="@{/recuperar}" th:object="${form}" method="post" class="login-form" novalidate>
            <div class="form-group">
                <label for="usuarioOEmail">Usuario o correo</label>
                <input type="text" id="usuarioOEmail" th:field="*{usuarioOEmail}" required autofocus
                       autocomplete="username"
                       th:classappend="${#fields.hasErrors('usuarioOEmail')} ? 'is-invalid'">
                <span class="form-error" th:if="${#fields.hasErrors('usuarioOEmail')}"
                      th:errors="*{usuarioOEmail}">Error</span>
                <small class="form-hint">
                    Si la cuenta existe, te llega un código de 6 dígitos al correo que tiene registrado.
                </small>
            </div>

            <button type="submit" class="btn btn--primary btn--full">Enviarme el código</button>
        </form>

        <p class="login-card__ayuda">
            <a th:href="@{/login}">Volver al inicio de sesión</a>
        </p>
    </main>

    <script th:src="@{/js/toast.js}" defer></script>
</body>
</html>
