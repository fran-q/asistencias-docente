<!DOCTYPE html>
<!--
  Recuperación de acceso, paso 1: a dónde mandamos el código.

  Usa el mismo esqueleto de dos columnas que el login. Antes era una tarjeta
  centrada de otro ancho, así que pasar de una pantalla a la otra movía todo de
  lugar y se leía como si fueran dos sistemas distintos.
-->
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recuperar el acceso - Visum</title>
    <script>
        (function () {
            var t = null;
            try { t = localStorage.getItem('tema'); } catch (e) { /* modo privado */ }
            if (!t) {
                t = (window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches)
                    ? 'claro' : 'oscuro';
            }
            document.documentElement.setAttribute('data-tema', t);
        })();
    </script>
    <link rel="stylesheet" th:href="@{/css/main.css}">
</head>
<body>
<div class="auth">

    <aside th:replace="~{auth/marca :: panel}"></aside>

    <main class="auth__panel">
        <div class="auth__tema">
            <button type="button" id="tema-toggle" class="btn-icono"
                    aria-label="Cambiar entre modo claro y oscuro" title="Cambiar de tema">
                <!-- Las clases tema-toggle__sol / __luna van dentro de los fragmentos:
                     th:replace descarta los atributos del placeholder. -->
                <svg th:replace="~{layout/iconos :: sol}"></svg>
                <svg th:replace="~{layout/iconos :: luna}"></svg>
            </button>
        </div>

        <div class="auth__centro">
            <div class="auth__form">

                <div class="auth__logo auth__logo--movil">
                    <span class="auth__logo-marca" aria-hidden="true">V</span>
                    <span class="auth__logo-texto">Visum</span>
                </div>

                <a th:href="@{/login}" class="auth__volver">
                    <svg th:replace="~{layout/iconos :: flechaIzq}"></svg>
                    <span>Volver a iniciar sesión</span>
                </a>

                <h1>Recuperar el acceso</h1>
                <p>Escribí tu usuario o tu correo y te enviamos un código de un solo uso.</p>

                <form th:action="@{/recuperar}" method="post" th:object="${form}" novalidate>
                    <!-- Los errores que no son de un campo llegan por acá. Sin este bloque el
                         formulario se recarga en silencio y parece que no pasó nada. -->
                    <div th:if="${#fields.hasGlobalErrors()}" class="alert alert--error" role="alert">
                        <p th:each="err : ${#fields.globalErrors()}" th:text="${err}">Error</p>
                    </div>

                    <div class="auth__campos">
                        <div class="form-group" style="margin:0">
                            <label for="usuarioOEmail">Usuario o correo</label>
                            <input type="text" id="usuarioOEmail" th:field="*{usuarioOEmail}"
                                   required autofocus autocomplete="username"
                                   placeholder="mgarcia o maria@cent35.edu.ar"
                                   th:errorclass="is-invalid">
                            <span class="form-error" th:if="${#fields.hasErrors('usuarioOEmail')}"
                                  th:errors="*{usuarioOEmail}">Error</span>
                        </div>

                        <button type="submit" class="btn btn--primary btn--lg btn--full"
                                style="margin-top:5px" data-texto-enviando="Enviando...">
                            Enviar el código
                        </button>
                    </div>
                </form>

                <!-- No se confirma ni se niega que la cuenta exista: decirlo permitiría
                     averiguar qué usuarios están dados de alta probando de a uno. -->
                <p class="auth__nota">
                    Si la cuenta existe, el código llega en unos segundos y vence a los
                    15 minutos.
                </p>
            </div>
        </div>
    </main>
</div>

<div id="flash-data"
     th:attr="data-success=${flashMensaje}, data-error=${flashError}" hidden></div>

<script th:src="@{/js/comun/tema.js}" defer></script>
<script th:src="@{/js/comun/toast.js}" defer></script>
<script th:src="@{/js/comun/envio-form.js}" defer></script>
<script th:src="@{/js/comun/form-validacion.js}" defer></script>
</body>
</html>
