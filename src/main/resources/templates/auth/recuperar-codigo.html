<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ingresar código - Asistencias</title>
    <link rel="stylesheet" th:href="@{/css/main.css}">
</head>
<body class="login-body">
    <main class="login-card">
        <header class="login-card__header">
            <div class="login-card__logo">A</div>
            <h1>Ingresá el código</h1>
            <p class="login-card__subtitle">
                <span th:if="${emailEnmascarado != null and !emailEnmascarado.isEmpty()}"
                      th:text="'Lo enviamos a ' + ${emailEnmascarado}">Lo enviamos a tu correo</span>
                <span th:unless="${emailEnmascarado != null and !emailEnmascarado.isEmpty()}">
                    Si la cuenta existe, el código ya está en su correo
                </span>
            </p>
        </header>

        <form th:action="@{/recuperar/codigo}" th:object="${form}" method="post" class="login-form" novalidate>

            <div th:if="${#fields.hasGlobalErrors()}" class="alert alert--error" role="alert">
                <p th:each="err : ${#fields.globalErrors()}" th:text="${err}">Error</p>
            </div>

            <div class="form-group">
                <label for="codigo">Código de 6 dígitos</label>
                <input type="text" id="codigo" th:field="*{codigo}" required autofocus
                       inputmode="numeric" autocomplete="one-time-code" maxlength="10"
                       th:classappend="${#fields.hasErrors('codigo')} ? 'is-invalid'">
                <span class="form-error" th:if="${#fields.hasErrors('codigo')}"
                      th:errors="*{codigo}">Error</span>
            </div>

            <div class="form-group">
                <label for="nuevaPassword">Contraseña nueva</label>
                <div class="password-input">
                    <input type="password" id="nuevaPassword" th:field="*{nuevaPassword}" required
                           autocomplete="new-password"
                           th:classappend="${#fields.hasErrors('nuevaPassword')} ? 'is-invalid'">
                    <button type="button" class="password-toggle" aria-label="Mostrar contraseña"></button>
                </div>
                <span class="form-error" th:if="${#fields.hasErrors('nuevaPassword')}"
                      th:errors="*{nuevaPassword}">Error</span>
            </div>

            <div class="form-group">
                <label for="confirmacion">Repetir contraseña</label>
                <div class="password-input">
                    <input type="password" id="confirmacion" th:field="*{confirmacion}" required
                           autocomplete="new-password"
                           th:classappend="${#fields.hasErrors('confirmacion')} ? 'is-invalid'">
                    <button type="button" class="password-toggle" aria-label="Mostrar contraseña"></button>
                </div>
                <span class="form-error" th:if="${#fields.hasErrors('confirmacion')}"
                      th:errors="*{confirmacion}">Error</span>
            </div>

            <button type="submit" class="btn btn--primary btn--full">Cambiar contraseña</button>
        </form>

        <p class="login-card__ayuda">
            <a th:href="@{/recuperar}">Pedir un código nuevo</a>
            &nbsp;·&nbsp;
            <a th:href="@{/login}">Volver al inicio de sesión</a>
        </p>
    </main>

    <script th:src="@{/js/toast.js}" defer></script>
    <script th:src="@{/js/password-ui.js}" defer></script>
</body>
</html>
