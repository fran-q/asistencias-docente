<!DOCTYPE html>
<html th:fragment="layout(title, content)"
      lang="es"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Token CSRF: lo leen los scripts que hacen fetch POST (ej. reconocimiento) -->
    <meta name="_csrf" th:content="${_csrf?.token}">
    <meta name="_csrf_header" th:content="${_csrf?.headerName}">
    <title th:replace="${title}">Visum</title>
    <link rel="stylesheet" th:href="@{/css/main.css}">
    <!--
      Tema (RNF-22). Va inline y ANTES de la hoja de estilos a proposito: cargado con
      defer, la pagina alcanzaba a pintarse oscura y despues saltaba a claro. Si nunca
      se eligio, se respeta la preferencia del sistema operativo.
    -->
    <script>
        (function () {
            var t = null;
            try { t = localStorage.getItem('tema'); } catch (e) { /* modo privado */ }
            if (!t) {
                t = window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches
                    ? 'claro' : 'oscuro';
            }
            document.documentElement.setAttribute('data-tema', t);
        })();
    </script>
</head>
<body>
    <!-- Primer elemento tabulable de la pagina: salta el menu completo. -->
    <a class="skip-link" href="#contenido">Saltar al contenido</a>

    <!--
      Suprime las transiciones del navbar durante la carga, para que el modo que
      se aplique enseguida no se vea "deslizando". navbar.js lo quita tras el
      primer frame y a partir de ahí las interacciones sí animan.

      El modo (hamburguesa vs. links completos) NO se decide acá: hace falta que
      el navbar exista para poder medirlo, así que eso ocurre en el script que va
      inmediatamente después del <header>.
    -->
    <script>
        document.body.classList.add('nav-preload');
    </script>

    <!-- ============ NAVBAR ============ -->
    <header class="navbar">
        <!-- Hamburguesa: visible en pantallas chicas (<=900px), oculta en desktop -->
        <button type="button" class="navbar__toggle"
                aria-label="Abrir menú"
                aria-controls="navbar-menu"
                aria-expanded="false"
                sec:authorize="isAuthenticated()">
            <svg viewBox="0 0 24 24" width="22" height="22" fill="none"
                 stroke="currentColor" stroke-width="2" stroke-linecap="round"
                 stroke-linejoin="round" aria-hidden="true">
                <line x1="3" y1="6"  x2="21" y2="6"/>
                <line x1="3" y1="12" x2="21" y2="12"/>
                <line x1="3" y1="18" x2="21" y2="18"/>
            </svg>
        </button>

        <div class="navbar__brand">
            <a th:href="@{/}" aria-label="Visum, ir al inicio">
                <span class="navbar__logo" aria-hidden="true">V</span>
                <span class="navbar__title">Visum</span>
            </a>
        </div>

        <!-- Navegacion agrupada por lo que la persona viene a hacer, no por el orden en
             que se construyeron los modulos: preparar el cursado (Academico), tomar y
             consultar asistencia (Asistencias), administrar quienes participan (Personal).
             Con doce enlaces sueltos la barra ya no entraba y todos pesaban igual. -->
        <nav class="navbar__menu" id="navbar-menu" sec:authorize="isAuthenticated()">

            <a th:href="@{/}" class="navbar__link">
                <svg th:replace="~{layout/iconos :: casa}"></svg>
                <span>Inicio</span>
            </a>

            <div class="navbar__grupo" sec:authorize="hasAnyRole('INSTITUCION', 'ADMIN')">
                <a class="navbar__grupo-boton" aria-expanded="false"
                   th:href="@{__${destinoAcademico}__}">
                    <svg th:replace="~{layout/iconos :: libro}"></svg>
                    <span>Académico</span>
                    <svg th:replace="~{layout/iconos :: flecha}"></svg>
                </a>
                <div class="navbar__submenu">
                    <a th:href="@{/carreras}"   class="navbar__sublink">Carreras</a>
                    <a th:href="@{/materias}"   class="navbar__sublink">Materias</a>
                    <a th:href="@{/comisiones}" class="navbar__sublink">Comisiones</a>
                    <a th:href="@{/horarios}"   class="navbar__sublink">Horarios</a>
                    <a th:href="@{/grilla}"     class="navbar__sublink">Grilla semanal</a>
                </div>
            </div>

            <div class="navbar__grupo" sec:authorize="hasAnyRole('INSTITUCION', 'ADMIN')">
                <a class="navbar__grupo-boton" aria-expanded="false"
                   th:href="@{__${destinoAsistencia}__}">
                    <svg th:replace="~{layout/iconos :: tilde}"></svg>
                    <span>Asistencias</span>
                    <svg th:replace="~{layout/iconos :: flecha}"></svg>
                </a>
                <div class="navbar__submenu">
                    <a th:href="@{/asistencia/pase}" class="navbar__sublink">Pase de asistencia</a>
                    <a th:href="@{/asistencias}"     class="navbar__sublink">Listado del día</a>
                    <a th:href="@{/reportes}"        class="navbar__sublink">Reportes</a>
                </div>
            </div>

            <div class="navbar__grupo" sec:authorize="hasAnyRole('INSTITUCION', 'ADMIN')">
                <a class="navbar__grupo-boton" aria-expanded="false"
                   th:href="@{__${destinoPersonal}__}">
                    <svg th:replace="~{layout/iconos :: personas}"></svg>
                    <span>Personal</span>
                    <svg th:replace="~{layout/iconos :: flecha}"></svg>
                </a>
                <div class="navbar__submenu">
                    <a th:href="@{/docentes}" class="navbar__sublink">Docentes</a>
                    <a th:href="@{/usuarios}" class="navbar__sublink"
                       sec:authorize="hasRole('INSTITUCION')">Usuarios del sistema</a>
                    <a th:href="@{/mi-institucion}" class="navbar__sublink"
                       sec:authorize="hasRole('INSTITUCION')">Mi institución</a>
                    <!-- Va en Personal y no en Asistencias aunque habilite el pase: lo que se
                         administra acá es la configuración del establecimiento, igual que Mi
                         institución, y no algo que se haga durante una clase. -->
                    <a th:href="@{/puestos}" class="navbar__sublink"
                       sec:authorize="hasRole('INSTITUCION')">Puestos de captura</a>
                </div>
            </div>
        </nav>

        <div class="navbar__user" sec:authorize="isAuthenticated()">
            <button type="button" id="tema-toggle" class="tema-toggle"
                    aria-label="Cambiar entre modo claro y oscuro" title="Cambiar de tema">
                <svg class="tema-toggle__sol" viewBox="0 0 24 24" width="18" height="18"
                     fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
                    <circle cx="12" cy="12" r="4"/>
                    <path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>
                </svg>
                <svg class="tema-toggle__luna" viewBox="0 0 24 24" width="18" height="18"
                     fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
                    <path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/>
                </svg>
            </button>
            <a th:href="@{/mi-cuenta}" class="navbar__username" sec:authentication="name"></a>
            <form th:action="@{/logout}" method="post" class="navbar__logout-form">
                <button type="submit" class="btn btn--ghost">Salir</button>
            </form>
        </div>
    </header>

    <!--
      Modo del navbar, decidido ANTES del primer paint.

      Por que va acá y no arriba. El modo se decide midiendo si los enlaces entran
      en el ancho disponible, y para medir el navbar tiene que existir: acaba de
      cerrarse el <header>, así que ya está en el DOM y todavía no se pintó nada.

      Por que no lo hace navbar.js. Ese script va con defer, o sea que corre recién
      en DOMContentLoaded, y el navegador puede pintar antes. Cuando gana el paint
      --se midió: primer paint a 336 ms contra DOMContentLoaded a 366 ms-- la página
      aparece un instante con el menú entero desplegado y después salta al drawer
      cerrado. Es una carrera: a veces se ve y a veces no, y se ve más seguido en
      máquinas lentas, que es donde peor queda.

      Por que no alcanzaba con sessionStorage. La versión anterior guardaba el modo
      de la navegación anterior y lo reponía acá arriba. Servía a partir de la
      segunda página, pero no en la primera de la sesión --el valor todavía no
      existe--, ni cuando quedó guardado el modo de una ventana ancha, ni en modo
      privado. Medir no tiene ninguno de esos huecos.

      El script es síncrono a propósito: bloquea el parseo unos milisegundos y a
      cambio garantiza que lo primero que se pinta ya es el modo correcto.
    -->
    <script>
        (function () {
            var navbar = document.querySelector('.navbar');
            // +1 de margen: scrollWidth y clientWidth pueden diferir por redondeo de
            // subpixel aunque no haya nada que desbordar.
            if (navbar && navbar.scrollWidth > navbar.clientWidth + 1) {
                document.body.classList.add('nav-compact');
            }
        })();
    </script>

    <!-- Backdrop oscuro detras del drawer en pantallas chicas -->
    <div class="navbar__backdrop" aria-hidden="true"></div>

    <!-- ============ CONTENIDO ============ -->
    <!-- Migas de pan. Se arman en el navegador a partir de la URL y del mapa de rutas,
         igual que el resaltado del menu: pedirle a cada controlador que las publique
         seria repetir en veinte lugares algo que ya se puede deducir de la direccion. -->
    <!--
      Los destinos de cada grupo viajan en data-* porque dependen del ROL, y el script
      corre en el navegador sin saber quien esta logueado: para el ADMIN, Personal lleva
      derecho a Docentes; para INSTITUCION, a la pantalla del grupo.
    -->
    <nav class="migas" aria-label="Ruta de navegación" sec:authorize="isAuthenticated()"
         th:attr="data-academico=${destinoAcademico},
                  data-asistencia=${destinoAsistencia},
                  data-personal=${destinoPersonal}">
        <ol class="migas__lista" id="migas"></ol>
    </nav>

    <main class="container" id="contenido" tabindex="-1">
        <div th:replace="${content}">
            <p>Contenido por defecto</p>
        </div>
    </main>

    <!-- ============ FLASH DATA + SCRIPTS ============ -->
    <div id="flash-data"
         th:attr="data-success=${flashMensaje},
                  data-warning=${flashWarning},
                  data-error=${flashError}"
         hidden></div>

    <script th:src="@{/js/comun/migas.js}" defer></script>
    <script th:src="@{/js/comun/tema.js}" defer></script>
    <script th:src="@{/js/comun/form-validacion.js}" defer></script>
    <script th:src="@{/js/comun/envio-form.js}" defer></script>
    <script th:src="@{/js/comun/toast.js}" defer></script>
    <script th:src="@{/js/comun/password-ui.js}" defer></script>
    <script th:src="@{/js/comun/table-scroll.js}" defer></script>
    <script th:src="@{/js/comun/confirm-modal.js}" defer></script>
    <script th:src="@{/js/comun/navbar.js}" defer></script>
    <script th:src="@{/js/comun/filtro-tabla.js}" defer></script>
</body>
</html>
