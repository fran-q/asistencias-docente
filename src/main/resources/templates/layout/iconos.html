<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<!--
  Iconos de la navegación, como fragmentos reutilizables.

  Van acá y no dentro de base.html para que el layout se siga leyendo: cada SVG
  ocupa varias líneas y con ocho iconos la barra quedaría irreconocible entre
  tanto trazo.

  Son SVG en línea, no una tipografía de iconos ni un archivo externo: heredan
  el color del texto con currentColor, así que acompañan solo el estado activo
  y el hover, y no agregan ninguna descarga.

  Todos comparten el mismo trazo (24x24, stroke-width 2, extremos redondeados)
  que la hamburguesa que ya estaba, para que no se note el injerto.
-->
<body>

<svg th:fragment="casa" class="nav-icono" viewBox="0 0 24 24" width="18" height="18"
     fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
     stroke-linejoin="round" aria-hidden="true" focusable="false">
    <path d="M3 9.5 12 3l9 6.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/>
</svg>

<svg th:fragment="libro" class="nav-icono" viewBox="0 0 24 24" width="18" height="18"
     fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
     stroke-linejoin="round" aria-hidden="true" focusable="false">
    <path d="M4 4h6a3 3 0 0 1 3 3v13a2.5 2.5 0 0 0-2.5-2.5H4z"/>
    <path d="M20 4h-6a3 3 0 0 0-3 3v13a2.5 2.5 0 0 1 2.5-2.5H20z"/>
</svg>

<svg th:fragment="tilde" class="nav-icono" viewBox="0 0 24 24" width="18" height="18"
     fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
     stroke-linejoin="round" aria-hidden="true" focusable="false">
    <path d="M21 11.5V12a9 9 0 1 1-5.3-8.2"/>
    <path d="m9 11 3 3 9-9"/>
</svg>

<svg th:fragment="personas" class="nav-icono" viewBox="0 0 24 24" width="18" height="18"
     fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
     stroke-linejoin="round" aria-hidden="true" focusable="false">
    <path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/>
    <circle cx="9" cy="7" r="4"/>
    <path d="M22 21v-2a4 4 0 0 0-3-3.9"/>
    <path d="M16 3.1a4 4 0 0 1 0 7.8"/>
</svg>

<!-- La flecha del desplegable: gira 180 grados por CSS cuando el grupo se abre. -->
<svg th:fragment="flecha" class="nav-flecha" viewBox="0 0 24 24" width="14" height="14"
     fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
     stroke-linejoin="round" aria-hidden="true" focusable="false">
    <path d="m6 9 6 6 6-6"/>
</svg>

</body>
</html>
