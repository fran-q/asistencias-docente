<!DOCTYPE html>
<!--
  Fragmentos de iconos.

  Uno por archivo y no un sprite SVG: los iconos se usan sueltos, en cantidades
  chicas, y un sprite obliga a un pedido más y a resolver el color por CSS
  desde afuera. Acá cada uno hereda currentColor del elemento que lo contiene,
  así que un icono dentro de un enlace activo se pinta del color del enlace sin
  ninguna regla extra.

  Todos comparten viewBox 0 0 24 24, trazo de 2 y puntas redondeadas, que es el
  criterio que ya traia el archivo original: la familia se nota cuando dos
  iconos distintos aparecen en la misma lista.

  Los cinco fragmentos que ya existian (casa, libro, tilde, personas, flecha)
  van TEXTUALES, sin tocar su geometria. Este archivo solo agrega.

  Uso:  <svg th:replace="~{layout/iconos :: casa}"></svg>
-->
<html xmlns:th="http://www.thymeleaf.org">
<body>

<!-- ============================================================================
     LOS CINCO ORIGINALES
     Van textuales, con su geometria y su stroke-width 2, porque los referencia
     el navbar horizontal que se conserva por compatibilidad: si cambiaran de
     trazo, una pantalla sin migrar mostraria iconos de otra familia.
     Los nuevos, mas abajo, respetan el mismo criterio de trazo.
============================================================================= -->

<svg th:fragment="casa" class="nav-icono" viewBox="0 0 24 24" width="18" height="18"
     fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
     stroke-linejoin="round" aria-hidden="true" focusable="false">
    <path d="M3 9.5 12 3l9 6.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/>
</svg>

<svg th:fragment="libro" class="nav-icono" viewBox="0 0 24 24" width="18" height="18"
     fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
     stroke-linejoin="round" aria-hidden="true" focusable="false">
    <path d="M4 4h6a3 3 0 0 1 3 3v13a2.5 2.5 0 0 0-2.5-2.5H4z"/>
    <path d="M20 4h-6a3 3 0 0 0-3 3v13a2.5 2.5 0 0 1 2.5-2.5H20z"/>
</svg>

<svg th:fragment="tilde" class="nav-icono" viewBox="0 0 24 24" width="18" height="18"
     fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
     stroke-linejoin="round" aria-hidden="true" focusable="false">
    <path d="M21 11.5V12a9 9 0 1 1-5.3-8.2"/>
    <path d="m9 11 3 3 9-9"/>
</svg>

<svg th:fragment="personas" class="nav-icono" viewBox="0 0 24 24" width="18" height="18"
     fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
     stroke-linejoin="round" aria-hidden="true" focusable="false">
    <path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/>
    <circle cx="9" cy="7" r="4"/>
    <path d="M22 21v-2a4 4 0 0 0-3-3.9"/>
    <path d="M16 3.1a4 4 0 0 1 0 7.8"/>
</svg>

<!-- La flecha del desplegable: gira 180 grados por CSS cuando el grupo se abre. -->
<svg th:fragment="flecha" class="nav-flecha" viewBox="0 0 24 24" width="14" height="14"
     fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
     stroke-linejoin="round" aria-hidden="true" focusable="false">
    <path d="m6 9 6 6 6-6"/>
</svg>

<!-- Sol y luna llevan su clase ACÁ ADENTRO, no en el <svg> que los invoca.
     th:replace reemplaza el elemento entero, atributos incluidos, así que la
     clase que se escriba en el placeholder del layout se descarta al renderizar.
     Sin clase, las reglas que muestran uno y esconden el otro no enganchan con
     nada y el botón de tema aparece con el sol y la luna a la vez.
============================================================================= -->

<!-- ============================================================================
     NUEVOS
     Los que pide la barra lateral (un icono por destino, no uno por grupo) y
     las pantallas de acceso.
============================================================================= -->

<svg th:fragment="materia" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor"
