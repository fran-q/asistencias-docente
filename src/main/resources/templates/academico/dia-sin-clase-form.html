<!DOCTYPE html>
<html th:replace="~{layout/base :: layout(~{::title}, ~{::section})}"
      xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Marcar días sin clase - Visum</title>
</head>
<body>
    <!-- El alta de los dias sin clase, en su propia pantalla como el resto de las altas. Vivia
         debajo del listado, que se abria siempre con el formulario a la vista aunque lo que se
         buscara fuera revisar los feriados del año. -->
    <section class="dia-sin-clase-form">
        <header class="page-header">
            <h1>Marcar días sin clase</h1>
            <p class="page-header__subtitle">
                Un feriado, o un receso entero de una vez. Esos días nadie queda ausente y el
                pase tampoco registra.
            </p>
        </header>

        <div class="card card--form">
            <form th:action="@{/dias-sin-clase/nuevo}" method="post" novalidate>
                <div th:if="${error}" class="alert alert--error" role="alert">
                    <p th:text="${error}">Error</p>
                </div>

                <!-- El año del listado del que se vino: Cancelar vuelve a ese y no al actual.
                     Tambien viaja con el envio, para que un rechazo lo conserve. -->
                <input type="hidden" name="anio" th:value="${anio}">

                <div class="form-row form-row--3">
                    <div class="form-group">
                        <label for="tipo">Tipo <span class="required">*</span></label>
                        <select id="tipo" name="tipo" required data-menu>
                            <option value="">Elegí el tipo</option>
                            <option th:each="t : ${tipos}" th:value="${t.name()}"
                                    th:selected="${t == tipo}"
                                    th:text="${t.etiqueta}">Feriado nacional</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="fecha">Fecha <span class="required">*</span></label>
                        <input type="date" id="fecha" name="fecha" required th:value="${fecha}">
                    </div>
                    <!-- Un receso son dos semanas: con "hasta" se marcan todas de una vez,
                         cada día como una fila. Los que ya estaban no se tocan. -->
                    <div class="form-group">
                        <label for="hasta">Hasta</label>
                        <input type="date" id="hasta" name="hasta" th:value="${hasta}">
                        <small class="form-hint">Para un receso. Vacío, se marca solo la fecha.</small>
                    </div>
                </div>
                <div class="form-group">
                    <label for="motivo">Motivo <span class="required">*</span></label>
                    <input type="text" id="motivo" name="motivo" required maxlength="120"
                           th:value="${motivo}"
                           placeholder="Revolución de Mayo, receso de invierno, jornada institucional...">
                    <small class="form-hint">
                        Dentro de un año nadie va a acordarse de por qué ese día estaba marcado.
                    </small>
                </div>

                <div class="form-actions">
                    <button type="submit" class="btn btn--primary"
                            data-texto-enviando="Guardando...">Marcar</button>
                    <a th:href="@{/dias-sin-clase(anio=${anio})}" class="btn btn--ghost">Cancelar</a>
                </div>
            </form>
        </div>
    </section>
</body>
</html>
