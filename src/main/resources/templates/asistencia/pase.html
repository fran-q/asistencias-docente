<!DOCTYPE html>
<html th:replace="~{layout/base :: layout(~{::title}, ~{::section})}"
      xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Pase de asistencia - Asistencias</title>
</head>
<body>
    <section class="pase">
        <header class="page-header pase__header">
            <h1>Pase de asistencia</h1>
            <p class="page-header__subtitle">
                Identifica al docente frente a la cámara y marca su asistencia
                a la clase que está en curso.
            </p>
        </header>

        <div class="card pase__card">
            <!-- El video y el recuadro comparten caja: el canvas se superpone al video y
                 ambos escalan juntos, asi el recuadro cae siempre sobre la cara. -->
            <div class="pase__camara">
                <video id="pa-video" class="pase__video" autoplay playsinline muted></video>
                <canvas id="pa-overlay" class="pase__overlay"></canvas>
                <canvas id="pa-canvas" hidden></canvas>
            </div>

            <!-- Resultado -->
            <div id="pa-estado-box" class="pase__estado">
                <p id="pa-estado-mensaje" class="pase__mensaje">Cámara apagada</p>
                <p id="pa-clase" class="pase__clase"></p>
            </div>

            <!-- Botones toggle -->
            <div class="pase__acciones">
                <button type="button" id="pa-btn-camara" class="btn btn--primary">
                    Encender cámara
                </button>
                <button type="button" id="pa-btn-pase" class="btn btn--primary" disabled>
                    Iniciar pase
                </button>
            </div>
        </div>

        <script th:src="@{/js/pase-asistencia.js}" defer></script>
    </section>
</body>
</html>
