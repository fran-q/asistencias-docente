<!DOCTYPE html>
<html th:replace="~{layout/base :: layout(~{::title}, ~{::section})}"
      xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Pase de asistencia - Visum</title>
</head>
<body>
    <section class="pase">
        <header class="page-header pase__header">
            <div class="pase__titulo">
                <h1>Pase de asistencia</h1>
                <p class="page-header__subtitle">
                    Identifica al docente frente a la cámara y marca su asistencia
                    a la clase que está en curso.
                </p>
            </div>

        </header>

        <div class="camara-layout">

            <!-- Izquierda: la cámara, que es lo único que hay que mirar con detalle -->
            <div class="camara-layout__principal">
                <div class="card card--no-padding">
                    <!-- El video y el recuadro comparten caja: el canvas se superpone al
                         video y ambos escalan juntos, asi el recuadro cae sobre la cara. -->
                    <div class="camara-caja">
                        <video id="pa-video" class="camara-video" autoplay playsinline muted
                       th:attr="data-camara=${camaraDelPuesto}"></video>
                        <canvas id="pa-overlay" class="camara-overlay"></canvas>
                        <canvas id="pa-canvas" hidden></canvas>
                    </div>
                </div>
            </div>

            <!-- Derecha: resultado y controles, a la altura de los ojos -->
            <aside class="camara-layout__lateral">

                <div class="card">
                    <div id="pa-estado-box" class="pase__estado">
                        <p id="pa-estado-mensaje" class="pase__mensaje">Cámara apagada</p>
                        <p id="pa-clase" class="pase__clase"></p>
                    </div>
                </div>

                <div class="card">
                    <!-- Un solo boton para arrancar: enciende la camara y larga el pase.
                         Apagar la camara es la accion secundaria, y aparece recien cuando
                         hay una camara prendida para apagar. -->
                    <div class="pase__acciones">
                        <button type="button" id="pa-btn-pase" class="btn btn--primary">
                            Iniciar pase
                        </button>
                        <button type="button" id="pa-btn-camara" class="btn btn--ghost" hidden>
                            Apagar cámara
                        </button>
                    </div>
                </div>

                <p class="pase__ayuda">
                    El docente tiene que sostener la posición unos segundos: la asistencia
                    se marca recién cuando el sistema confirma la misma identidad varias
                    veces seguidas.
                </p>
            </aside>
        </div>

        <!--
          Pasar al kiosco. Solo si ESTE equipo lo tiene habilitado: el botón cierra la
          sesión, así que ofrecerlo con el kiosco apagado dejaría a la persona afuera y
          contra una pantalla que no abre.

          Estaba arriba, al lado del título. Va acá abajo, apartado y a la derecha, porque
          es lo último que se hace en el día y no algo que se elija al entrar: se deja el
          equipo tomando asistencia solo cuando ya no queda nadie para atenderlo. Y sigue
          lejos de "Apagar cámara", que es lo que el comentario anterior cuidaba: apretarlo
          de rebote cierra la sesión.

          Va uno solo y no dos. La versión anterior de esta pantalla lo tenía en el
          encabezado; duplicarlo pondría la misma acción --que cierra la sesión-- en dos
          lugares, y la que se aprieta sin querer es siempre la que sobra.
        -->
        <div class="pase__pie" th:if="${kioscoDisponible}">
            <form th:action="@{/logout}" method="post" class="inline-form"
                  data-confirm="¿Dejar el equipo tomando asistencia sin supervisión?"
                  data-confirm-detail="Se cierra tu sesión y la pantalla queda registrando entradas y salidas sola. Es a propósito: si la sesión siguiera abierta detrás, alcanzaría con apretar Atrás para entrar a todo el sistema. Para volver vas a tener que iniciar sesión de nuevo."
                  data-confirm-action="Dejar sin supervisión">
                <input type="hidden" name="destino" value="kiosco">
                <button type="submit" class="btn btn--ghost btn--sm pase__ir-kiosco"
                        data-texto-enviando="Cerrando sesión...">
                    Ir al kiosco: asistencia sin supervisión
                </button>
            </form>
        </div>

        <script th:src="@{/js/facial/camara.js}" defer></script>
        <script th:src="@{/js/facial/pase-asistencia.js}" defer></script>
    </section>
</body>
</html>
