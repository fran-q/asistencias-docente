<!DOCTYPE html>
<html th:replace="~{layout/base :: layout(~{::title}, ~{::section})}"
      xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Pase de asistencia - Asistencias</title>
</head>
<body>
    <section class="pase">
        <header class="page-header pase__header">
            <h1>Pase de asistencia</h1>
            <p class="page-header__subtitle">
                Identifica al docente frente a la cámara y marca su asistencia
                a la clase que está en curso.
            </p>
        </header>

        <div class="camara-layout">

            <!-- Izquierda: la cámara, que es lo único que hay que mirar con detalle -->
            <div class="camara-layout__principal">
                <div class="card card--no-padding">
                    <!-- El video y el recuadro comparten caja: el canvas se superpone al
                         video y ambos escalan juntos, asi el recuadro cae sobre la cara. -->
                    <div class="camara-caja">
                        <video id="pa-video" class="camara-video" autoplay playsinline muted></video>
                        <canvas id="pa-overlay" class="camara-overlay"></canvas>
                        <canvas id="pa-canvas" hidden></canvas>
                    </div>
                </div>
            </div>

            <!-- Derecha: resultado y controles, a la altura de los ojos -->
            <aside class="camara-layout__lateral">

                <div class="card">
                    <div id="pa-estado-box" class="pase__estado">
                        <p id="pa-estado-mensaje" class="pase__mensaje">Cámara apagada</p>
                        <p id="pa-clase" class="pase__clase"></p>
                    </div>
                </div>

                <div class="card">
                    <!-- Un solo boton para arrancar: enciende la camara y larga el pase.
                         Apagar la camara es la accion secundaria, y aparece recien cuando
                         hay una camara prendida para apagar. -->
                    <div class="pase__acciones">
                        <button type="button" id="pa-btn-pase" class="btn btn--primary">
                            Iniciar pase
                        </button>
                        <button type="button" id="pa-btn-camara" class="btn btn--ghost" hidden>
                            Apagar cámara
                        </button>
                    </div>
                </div>

                <p class="pase__ayuda">
                    El docente tiene que sostener la posición unos segundos: la asistencia
                    se marca recién cuando el sistema confirma la misma identidad varias
                    veces seguidas.
                </p>
            </aside>
        </div>

        <script th:src="@{/js/pase-asistencia.js}" defer></script>
    </section>
</body>
</html>
