plugins {
	id 'java'
	id 'org.springframework.boot' version '3.5.14'
	id 'io.spring.dependency-management' version '1.1.7'
	// Hace efectiva la propiedad javacpp.platform de gradle.properties: sin el, opencv-platform
	// arrastra los binarios de las nueve plataformas --android e iOS incluidos-- y el JAR pasa de
	// 45 a 417 MB. Ver ADR-0007, decision 2, y gradle.properties.
	// 1.5.10 y no 1.5.11: el plugin se publica aparte de JavaCV y su ultima version es esa.
	// No tiene que coincidir --lo unico que hace es elegir el clasificador de los binarios
	// segun javacpp.platform-- pero el desfasaje confunde si no esta dicho.
	id 'org.bytedeco.gradle-javacpp-platform' version '1.5.10'
}

group = 'edu.cent35'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

repositories {
	mavenCentral()
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-actuator'
	implementation 'org.springframework.boot:spring-boot-starter-aop'
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-mail'
	implementation 'org.springframework.boot:spring-boot-starter-security'
	implementation 'org.springframework.boot:spring-boot-starter-thymeleaf'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'org.springframework.boot:spring-boot-starter-web'
	implementation 'org.flywaydb:flyway-core'
	implementation 'org.flywaydb:flyway-mysql'
	implementation 'org.thymeleaf.extras:thymeleaf-extras-springsecurity6'

	// OpenPDF: generacion del reporte en PDF. Es el fork libre de iText 2, con
	// licencia LGPL/MPL, asi que entra en la restriccion de usar solo software
	// abierto. Se eligio sobre PDFBox porque trae tablas con ancho de columna y
	// repeticion de encabezado resueltas; con PDFBox habria que dibujar cada
	// linea a mano y calcular los saltos de pagina.
	implementation 'com.github.librepdf:openpdf:1.3.43'

	// === Reconocimiento facial - Sprint 4 ===
	// JavaCV: wrapper Java de OpenCV. opencv-platform incluye el modulo
	// opencv_face (contrib) necesario para LBPHFaceRecognizer.
	// La descarga de binarios nativos se restringe a Windows via gradle.properties
	// (javacpp.platform). Ver ADR-0007.
	implementation 'org.bytedeco:javacv:1.5.11'
	implementation 'org.bytedeco:opencv-platform:4.10.0-1.5.11'
	testImplementation 'com.microsoft.playwright:playwright:1.61.0'
	compileOnly 'org.projectlombok:lombok'
	developmentOnly 'org.springframework.boot:spring-boot-devtools'
	runtimeOnly 'org.mariadb.jdbc:mariadb-java-client'      // Driver nativo MariaDB
	annotationProcessor 'org.projectlombok:lombok'
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testImplementation 'org.springframework.security:spring-security-test'
	testCompileOnly 'org.projectlombok:lombok'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
	testRuntimeOnly 'com.h2database:h2'                     // BD en memoria para tests/CI
	testAnnotationProcessor 'org.projectlombok:lombok'
}

// El codigo fuente esta en UTF-8 (acentos y enies en comentarios y mensajes).
// Java 21 ya usa UTF-8 por defecto, pero se fija explicitamente para que la
// compilacion no dependa del locale de la maquina que buildea.
tasks.withType(JavaCompile).configureEach {
	options.encoding = 'UTF-8'
}

// Los unitarios (Mockito, sin contexto de Spring) y los de integracion
// (@SpringBootTest sobre H2) se corren por separado: `test` es la vuelta rapida
// mientras se programa, `integrationTest` es la que levanta el contexto.
// Los de integracion viven en el paquete `integracion` y se llaman *IT.
tasks.named('test') {
	useJUnitPlatform()
	exclude '**/integracion/**'
}

tasks.register('integrationTest', Test) {
	group = 'verification'
	description = 'Corre solo los tests de integracion (@SpringBootTest sobre H2)'
	useJUnitPlatform()
	testClassesDirs = sourceSets.test.output.classesDirs
	classpath = sourceSets.test.runtimeClasspath
	include '**/integracion/**'
	shouldRunAfter tasks.named('test')
}

// Sin este dependsOn, `./gradlew build` dejaria de correr los tests de
// integracion y nadie se enteraria: la build seguiria en verde con trece clases
// sin ejecutar. Es la misma forma de fallo que TD-007, donde un aspecto quedo
// inactivo en silencio y 107 tests en verde no lo detectaron.
tasks.named('check') {
	dependsOn tasks.named('integrationTest')
}

// Al correr ./gradlew bootRun activa automaticamente el perfil "local"
// para cargar application-local.properties con las credenciales de XAMPP.
bootRun {
	args = ['--spring.profiles.active=local']
}

// El perfil local tiene que estar en src/main/resources para que bootRun lo
// encuentre en el classpath, pero no tiene por que viajar dentro del JAR: ahi
// son las credenciales de XAMPP metidas en un artefacto que se entrega o se
// comparte. El .gitignore cuida el repositorio publico y no el empaquetado.
// bootRun no se ve afectado: lee de build/resources/main, no del JAR.
// Va sobre TODAS las tareas Jar y no solo sobre bootJar: el plugin de Spring Boot
// tambien genera asistencias-x.x.x-plain.jar con la tarea `jar`, y excluirlo solo
// de bootJar dejaba las credenciales dentro del otro. Cualquier empaquetado nuevo
// queda cubierto por el withType.
tasks.withType(Jar).configureEach {
	exclude 'application-local.properties'
}

// === Playwright: descarga de binarios de navegador ===
// Playwright no reutiliza el Chrome del sistema: baja sus propios binarios,
// ligados a la version de la libreria. Hay que volver a correr esta tarea
// cada vez que se suba la version de Playwright en dependencies.
tasks.register('instalarNavegadores', JavaExec) {
	group = 'playwright'
	description = 'Descarga los binarios de navegador que usa Playwright'

	// La clase CLI viene con la dependencia declarada en testImplementation,
	// por eso el classpath tiene que ser el de test y no el de main.
	classpath = sourceSets.test.runtimeClasspath
	mainClass = 'com.microsoft.playwright.CLI'

	// El proyecto fija toolchain 21; se usa el mismo launcher para no depender
	// del JVM con el que arranque el daemon de Gradle.
	javaLauncher = javaToolchains.launcherFor(java.toolchain)

	args = ['install', 'chromium']
}

// =============================================================================
//  Empaquetado para Windows (ADR-0022)
// =============================================================================
//  Arma la aplicacion instalable con jpackage, que viene con el JDK 21. Lleva Java
//  adentro, asi que la maquina de la institucion no tiene que instalarlo.
//
//  DOS TIPOS DE SALIDA
//    ./gradlew empaquetar                      -> app-image: una carpeta que se copia y
//                                                 se ejecuta. No necesita nada mas.
//    ./gradlew empaquetar -PtipoDePaquete=msi  -> el instalador .msi.
//
//  El .msi EXIGE WiX Toolset instalado en la maquina que empaqueta; sin el, jpackage
//  falla diciendo que no encuentra "candle". El app-image no necesita nada.
//
//  LO QUE ESTO TODAVIA NO HACE
//  No trae MariaDB ni registra los servicios de Windows: eso es el paso siguiente del
//  ADR-0022 y va en los scripts de instalacion. Lo de aca es la aplicacion sola.
// =============================================================================

// jpackage rechaza una version con sufijo: 0.0.1-SNAPSHOT no le sirve para el .msi.
def versionDelPaquete = project.version.toString().replaceAll('-SNAPSHOT$', '')
def tipoDePaquete = project.findProperty('tipoDePaquete') ?: 'app-image'

// El JAR entra a jpackage desde una carpeta que contiene SOLO a el: --input se lleva todo
// lo que encuentre, y build/libs tiene tambien el -plain.jar, que no arranca nada.
tasks.register('prepararEmpaquetado', Copy) {
	group = 'distribution'
	description = 'Deja el JAR ejecutable solo, listo para jpackage'
	dependsOn tasks.named('bootJar')
	from(tasks.named('bootJar').map { it.archiveFile })
	into layout.buildDirectory.dir('empaquetado/entrada')
	rename { 'visum.jar' }
}

tasks.register('empaquetar', Exec) {
	group = 'distribution'
	description = 'Arma la aplicacion de Windows con Java adentro (jpackage)'
	dependsOn tasks.named('prepararEmpaquetado')

	def jdk = javaToolchains.launcherFor(java.toolchain).get().metadata.installationPath
	def entrada = layout.buildDirectory.dir('empaquetado/entrada').get().asFile
	def salida = layout.buildDirectory.dir('empaquetado/salida').get().asFile

	doFirst {
		// jpackage se planta si el destino ya tiene una version anterior.
		delete salida
		salida.mkdirs()
	}

	commandLine(
		"${jdk}/bin/jpackage",
		'--type', tipoDePaquete,
		'--name', 'Visum',
		'--app-version', versionDelPaquete,
		'--vendor', 'CENT 35',
		'--description', 'Registro de asistencia docente por reconocimiento facial',
		'--input', entrada.absolutePath,
		'--main-jar', 'visum.jar',
		'--dest', salida.absolutePath,
		// El perfil de la instalacion autonoma. Sin esto arranca como un despliegue comun:
		// sin asistente de primer arranque, sin recuperacion por clave y pidiendo un SMTP.
		'--java-options', '-Dspring.profiles.active=instalacion'
		// Sin --win-console: es un flag sin valor, y su AUSENCIA es lo que deja la aplicacion
		// sin ventana de consola. Pasarle 'false' hace que jpackage lo lea como otra opcion y
		// falle con "Invalid Option: [false]". Los logs van al archivo que fija el perfil.
	)
}

// La carpeta lista para instalar: lo que arma jpackage, mas los scripts y los dos
// binarios de terceros que no viven en el repositorio (ver instalador/README.md).
tasks.register('armarInstalable') {
	group = 'distribution'
	description = 'Deja la carpeta completa: aplicacion, MariaDB, WinSW y los scripts'
	dependsOn tasks.named('empaquetar')

	def destino = layout.buildDirectory.dir('empaquetado/salida/Visum')
	def scripts = layout.projectDirectory.dir('instalador')
	def mariadb = layout.projectDirectory.dir('vendor/mariadb')
	def winsw = layout.projectDirectory.file('vendor/WinSW.exe')

	doLast {
		def salida = destino.get().asFile
		if (!salida.exists()) {
			throw new GradleException("No esta ${salida}: ¿corrio 'empaquetar'?")
		}

		copy {
			from scripts
			into new File(salida, 'instalador')
		}

		// Los que faltan se avisan uno por uno y con su motivo. Un paquete al que le falta
		// MariaDB se arma igual, se copia igual, y recien falla en la maquina de la
		// institucion: mejor que lo diga acá.
		def faltantes = []

		if (mariadb.asFile.exists()) {
			copy {
				from mariadb
				into new File(salida, 'mariadb')
			}
			logger.lifecycle('  MariaDB incluida.')
		} else {
			faltantes << "vendor/mariadb/  (la MariaDB portable, descomprimida)"
		}

		if (winsw.asFile.exists()) {
			copy {
				from winsw
				into new File(salida, 'instalador')
			}
			logger.lifecycle('  WinSW incluido.')
		} else {
			faltantes << "vendor/WinSW.exe (el ejecutable de WinSW para .NET 4)"
		}

		logger.lifecycle('')
		logger.lifecycle("  Paquete en: ${salida}")
		if (!faltantes.isEmpty()) {
			logger.warn('')
			logger.warn('  ATENCION: el paquete esta INCOMPLETO y no se va a poder instalar.')
			logger.warn('  Falta poner:')
			faltantes.each { logger.warn("    - ${it}") }
			logger.warn('  Ver instalador/README.md.')
		}
	}
}

// El .msi: un solo archivo que copia todo a la maquina y deja elegir la carpeta.
//
// Toma la carpeta que ya armo armarInstalable y la envuelve --modo --app-image de
// jpackage-- en vez de rehacerla: asi el instalador lleva exactamente lo que se probo.
//
// NECESITA WiX 3, que jpackage busca en el PATH (candle.exe y light.exe). Va en
// vendor/wix/, que no se versiona. Sin el, jpackage falla diciendo que no lo encuentra.
//
// OJO: el .msi copia archivos y nada mas. NO registra los servicios ni crea la base: eso
// lo hace Instalar-Visum.bat, que queda en la carpeta instalada. Un .msi no puede correr
// un script de post-instalacion, y disfrazarlo seria peor: alguien instalaria el paquete,
// veria "instalacion completa" y despues nada funcionaria.
tasks.register('armarMsi', Exec) {
	group = 'distribution'
	description = 'Envuelve la carpeta instalable en un .msi (requiere WiX en vendor/wix)'
	dependsOn tasks.named('armarInstalable')

	def jdk = javaToolchains.launcherFor(java.toolchain).get().metadata.installationPath
	def imagen = layout.buildDirectory.dir('empaquetado/salida/Visum').get().asFile
	def destino = layout.buildDirectory.dir('empaquetado/instalador').get().asFile
	def wix = layout.projectDirectory.dir('vendor/wix').asFile

	doFirst {
		if (!new File(wix, 'candle.exe').exists()) {
			throw new GradleException(
				"Falta WiX en ${wix}. Ver instalador/README.md: sin candle.exe y light.exe, " +
				"jpackage no puede armar el .msi.")
		}
		delete destino
		destino.mkdirs()
	}

	// jpackage busca WiX en el PATH del proceso, no en una opcion propia.
	environment 'PATH', "${wix}${File.pathSeparator}${System.getenv('PATH')}"

	commandLine(
		"${jdk}/bin/jpackage",
		'--type', 'msi',
		'--app-image', imagen.absolutePath,
		'--name', 'Visum',
		'--app-version', versionDelPaquete,
		'--vendor', 'CENT 35',
		'--description', 'Registro de asistencia docente por reconocimiento facial',
		'--dest', destino.absolutePath,
		// Entrada en el menu inicio y eleccion de carpeta al instalar. NO se pide
		// --win-shortcut: el acceso directo util es el que crea Instalar-Visum.bat, que abre
		// el navegador. Uno que lance el ejecutable arrancaria una segunda copia por fuera
		// del servicio, y serian dos Visum peleando por el mismo puerto.
		'--win-menu',
		'--win-dir-chooser',
		'--win-upgrade-uuid', '7b1f3a52-9c4d-4e18-8f6a-2d5b0c7e9a31'
	)

	doLast {
		logger.lifecycle('')
		logger.lifecycle("  Instalador en: ${destino}")
		logger.lifecycle('  Despues de instalarlo hay que correr UNA VEZ Instalar-Visum.bat')
		logger.lifecycle('  desde la carpeta instalada, para registrar los servicios.')
	}
}
