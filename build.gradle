plugins {
	id 'java'
	id 'org.springframework.boot' version '3.5.14'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'edu.cent35'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

repositories {
	mavenCentral()
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-actuator'
	implementation 'org.springframework.boot:spring-boot-starter-aop'
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-mail'
	implementation 'org.springframework.boot:spring-boot-starter-security'
	implementation 'org.springframework.boot:spring-boot-starter-thymeleaf'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'org.springframework.boot:spring-boot-starter-web'
	implementation 'org.flywaydb:flyway-core'
	implementation 'org.flywaydb:flyway-mysql'
	implementation 'org.thymeleaf.extras:thymeleaf-extras-springsecurity6'

	// === Reconocimiento facial - Sprint 4 ===
	// JavaCV: wrapper Java de OpenCV. opencv-platform incluye el modulo
	// opencv_face (contrib) necesario para LBPHFaceRecognizer.
	// La descarga de binarios nativos se restringe a Windows via gradle.properties
	// (javacpp.platform). Ver ADR-0007.
	implementation 'org.bytedeco:javacv:1.5.11'
	implementation 'org.bytedeco:opencv-platform:4.10.0-1.5.11'
	compileOnly 'org.projectlombok:lombok'
	developmentOnly 'org.springframework.boot:spring-boot-devtools'
	runtimeOnly 'org.mariadb.jdbc:mariadb-java-client'      // Driver nativo MariaDB
	annotationProcessor 'org.projectlombok:lombok'
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testImplementation 'org.springframework.security:spring-security-test'
	testCompileOnly 'org.projectlombok:lombok'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
	testRuntimeOnly 'com.h2database:h2'                     // BD en memoria para tests/CI
	testAnnotationProcessor 'org.projectlombok:lombok'
}

// El codigo fuente esta en UTF-8 (acentos y enies en comentarios y mensajes).
// Java 21 ya usa UTF-8 por defecto, pero se fija explicitamente para que la
// compilacion no dependa del locale de la maquina que buildea.
tasks.withType(JavaCompile).configureEach {
	options.encoding = 'UTF-8'
}

tasks.named('test') {
	useJUnitPlatform()
}

// Al correr ./gradlew bootRun activa automaticamente el perfil "local"
// para cargar application-local.properties con las credenciales de XAMPP.
bootRun {
	args = ['--spring.profiles.active=local']
}
