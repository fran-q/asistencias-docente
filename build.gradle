plugins {
	id 'java'
	id 'org.springframework.boot' version '3.5.14'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'edu.cent35'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

repositories {
	mavenCentral()
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-actuator'
	implementation 'org.springframework.boot:spring-boot-starter-aop'
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-mail'
	implementation 'org.springframework.boot:spring-boot-starter-security'
	implementation 'org.springframework.boot:spring-boot-starter-thymeleaf'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'org.springframework.boot:spring-boot-starter-web'
	implementation 'org.flywaydb:flyway-core'
	implementation 'org.flywaydb:flyway-mysql'
	implementation 'org.thymeleaf.extras:thymeleaf-extras-springsecurity6'

	// OpenPDF: generacion del reporte en PDF. Es el fork libre de iText 2, con
	// licencia LGPL/MPL, asi que entra en la restriccion de usar solo software
	// abierto. Se eligio sobre PDFBox porque trae tablas con ancho de columna y
	// repeticion de encabezado resueltas; con PDFBox habria que dibujar cada
	// linea a mano y calcular los saltos de pagina.
	implementation 'com.github.librepdf:openpdf:1.3.43'

	// === Reconocimiento facial - Sprint 4 ===
	// JavaCV: wrapper Java de OpenCV. opencv-platform incluye el modulo
	// opencv_face (contrib) necesario para LBPHFaceRecognizer.
	// La descarga de binarios nativos se restringe a Windows via gradle.properties
	// (javacpp.platform). Ver ADR-0007.
	implementation 'org.bytedeco:javacv:1.5.11'
	implementation 'org.bytedeco:opencv-platform:4.10.0-1.5.11'
	testImplementation 'com.microsoft.playwright:playwright:1.61.0'
	compileOnly 'org.projectlombok:lombok'
	developmentOnly 'org.springframework.boot:spring-boot-devtools'
	runtimeOnly 'org.mariadb.jdbc:mariadb-java-client'      // Driver nativo MariaDB
	annotationProcessor 'org.projectlombok:lombok'
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testImplementation 'org.springframework.security:spring-security-test'
	testCompileOnly 'org.projectlombok:lombok'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
	testRuntimeOnly 'com.h2database:h2'                     // BD en memoria para tests/CI
	testAnnotationProcessor 'org.projectlombok:lombok'
}

// El codigo fuente esta en UTF-8 (acentos y enies en comentarios y mensajes).
// Java 21 ya usa UTF-8 por defecto, pero se fija explicitamente para que la
// compilacion no dependa del locale de la maquina que buildea.
tasks.withType(JavaCompile).configureEach {
	options.encoding = 'UTF-8'
}

// Los unitarios (Mockito, sin contexto de Spring) y los de integracion
// (@SpringBootTest sobre H2) se corren por separado: `test` es la vuelta rapida
// mientras se programa, `integrationTest` es la que levanta el contexto.
// Los de integracion viven en el paquete `integracion` y se llaman *IT.
tasks.named('test') {
	useJUnitPlatform()
	exclude '**/integracion/**'
}

tasks.register('integrationTest', Test) {
	group = 'verification'
	description = 'Corre solo los tests de integracion (@SpringBootTest sobre H2)'
	useJUnitPlatform()
	testClassesDirs = sourceSets.test.output.classesDirs
	classpath = sourceSets.test.runtimeClasspath
	include '**/integracion/**'
	shouldRunAfter tasks.named('test')
}

// Sin este dependsOn, `./gradlew build` dejaria de correr los tests de
// integracion y nadie se enteraria: la build seguiria en verde con trece clases
// sin ejecutar. Es la misma forma de fallo que TD-007, donde un aspecto quedo
// inactivo en silencio y 107 tests en verde no lo detectaron.
tasks.named('check') {
	dependsOn tasks.named('integrationTest')
}

// Al correr ./gradlew bootRun activa automaticamente el perfil "local"
// para cargar application-local.properties con las credenciales de XAMPP.
bootRun {
	args = ['--spring.profiles.active=local']
}

// El perfil local tiene que estar en src/main/resources para que bootRun lo
// encuentre en el classpath, pero no tiene por que viajar dentro del JAR: ahi
// son las credenciales de XAMPP metidas en un artefacto que se entrega o se
// comparte. El .gitignore cuida el repositorio publico y no el empaquetado.
// bootRun no se ve afectado: lee de build/resources/main, no del JAR.
// Va sobre TODAS las tareas Jar y no solo sobre bootJar: el plugin de Spring Boot
// tambien genera asistencias-x.x.x-plain.jar con la tarea `jar`, y excluirlo solo
// de bootJar dejaba las credenciales dentro del otro. Cualquier empaquetado nuevo
// queda cubierto por el withType.
tasks.withType(Jar).configureEach {
	exclude 'application-local.properties'
}

// === Playwright: descarga de binarios de navegador ===
// Playwright no reutiliza el Chrome del sistema: baja sus propios binarios,
// ligados a la version de la libreria. Hay que volver a correr esta tarea
// cada vez que se suba la version de Playwright en dependencies.
tasks.register('instalarNavegadores', JavaExec) {
	group = 'playwright'
	description = 'Descarga los binarios de navegador que usa Playwright'

	// La clase CLI viene con la dependencia declarada en testImplementation,
	// por eso el classpath tiene que ser el de test y no el de main.
	classpath = sourceSets.test.runtimeClasspath
	mainClass = 'com.microsoft.playwright.CLI'

	// El proyecto fija toolchain 21; se usa el mismo launcher para no depender
	// del JVM con el que arranque el daemon de Gradle.
	javaLauncher = javaToolchains.launcherFor(java.toolchain)

	args = ['install', 'chromium']
}